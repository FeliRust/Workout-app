<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>MuscleTrack · Meus treinos</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f3f4f6;background:#0b1020}*{box-sizing:border-box}body{margin:0;max-width:780px;margin-inline:auto;padding:18px 16px 110px}h1{margin:3px 0;font-size:28px}h2{font-size:19px;margin:0}p{color:#9ca3af}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{color:#a5b4fc;font-weight:700;font-size:12px;letter-spacing:2px}.muted{color:#9ca3af;font-size:13px}.pill{border:1px solid #374151;border-radius:99px;padding:7px 11px;font-size:12px;color:#d1d5db}.tabs{display:flex;gap:7px;margin:15px 0;overflow:auto}.tabs button,.btn{border:1px solid #374151;background:#1f2937;color:#e5e7eb;border-radius:12px;padding:12px 14px;font-weight:650;cursor:pointer}.tabs button.active,.primary{background:#6366f1;border-color:#6366f1;color:white}.tabs button{flex:1;white-space:nowrap}.card{background:#151d30;border:1px solid #2d374d;border-radius:18px;padding:17px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.exname{font-size:16px;font-weight:700}.tag{font-size:12px;color:#a5b4fc;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:13px 0}.field label{font-size:11px;color:#9ca3af;display:block;margin-bottom:5px}.field input{width:100%;min-width:0;background:#0b1020;border:1px solid #3b455b;color:white;border-radius:10px;padding:10px;font-size:15px}.set{display:grid;grid-template-columns:35px 1fr 1fr 45px;align-items:center;gap:8px;margin-top:9px}.set input{width:100%;background:#0b1020;color:white;border:1px solid #374151;border-radius:9px;padding:10px;min-width:0}.set button{border:1px solid #374151;background:#202b41;color:white;border-radius:9px;height:40px}.set button.done{background:#166534}.hint{font-size:12px;color:#9ca3af;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1}.bottom{position:fixed;bottom:0;left:0;right:0;background:#101827;border-top:1px solid #374151;padding:10px 15px env(safe-area-inset-bottom);display:flex;justify-content:center;gap:8px}.bottom button{max-width:230px;flex:1}.hidden{display:none}.stat{background:#151d30;border-radius:13px;padding:12px;flex:1;text-align:center}.stat b{display:block;font-size:22px}.log{border-bottom:1px solid #374151;padding:11px 0}.small{font-size:12px}.danger{color:#fca5a5}.link{color:#a5b4fc;text-decoration:underline;cursor:pointer}select{background:#1f2937;color:white;border:1px solid #374151;padding:10px;border-radius:10px;width:100%}textarea{width:100%;background:#0b1020;color:white;border:1px solid #374151;border-radius:10px;padding:10px;min-height:70px}details{margin-top:12px}summary{cursor:pointer;color:#a5b4fc;font-size:13px}#toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#374151;padding:12px 20px;border-radius:12px;display:none;z-index:5}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div id="toast"></div><header><div><div class="brand">MUSCLETRACK</div><h1>Meu treino 💪</h1><div class="muted">MuscleFit Piracicamirim · 3 dias/semana</div></div><div class="pill" id="connectionStatus">Local</div></header><nav class="tabs" id="tabs"><button data-tab="A" class="active">Seg · A</button><button data-tab="B">Qua · B</button><button data-tab="C">Sáb · C</button><button data-tab="history">Histórico</button><button data-tab="settings">Dados</button></nav><main id="main"></main><div class="bottom"><button class="btn" id="timerBtn">⏱ Descanso 60s</button><button class="btn primary" id="saveBtn">✓ Salvar treino</button></div><script>
const exercises={A:[['Supino reto na máquina','Peito','Anilhas por lado','Empurre à frente sem perder o apoio das costas.'],['Peck deck','Peito','Total','Feche os braços de modo controlado, sem forçar o ombro.'],['Puxada alta na máquina','Costas','Total','Puxe em direção à parte superior do peito, sem balanço.'],['Remada baixa na máquina','Costas','Total','Puxe os cotovelos para trás e controle o retorno.'],['Rosca Scott na máquina','Bíceps','Total','Mantenha o braço apoiado e evite tirar o cotovelo do suporte.'],['Rosca martelo com halteres','Bíceps','Por mão','Palmas voltadas para dentro; não balance o tronco.'],['Tríceps máquina com apoio','Tríceps','Total','Apoie os braços e estenda os cotovelos de forma controlada.'],['Extensão de tríceps na polia','Tríceps','Total','Mantenha cotovelos próximos ao tronco e controle a volta.'],['Leg press 45°','Pernas','Anilhas adicionadas','Mantenha lombar apoiada e não trave os joelhos.']],B:[['Remada articulada','Costas','Por lado ou total','Apoie o peito, puxe com os cotovelos e não balance o tronco.'],['Puxada alta pegada neutra','Costas','Total','Puxe em direção ao peito com postura estável.'],['Supino inclinado','Peito','Por lado ou total','Empurre para cima e à frente, controlando a descida.'],['Crucifixo na máquina','Peito','Total','Feche os braços suavemente, sem forçar amplitude.'],['Rosca direta na polia','Bíceps','Total','Flexione os cotovelos sem balançar o tronco.'],['Rosca concentrada','Bíceps','Por mão','Apoie o braço na coxa e controle a descida.'],['Tríceps francês na polia','Tríceps','Total','Estenda os cotovelos com os braços elevados.'],['Tríceps corda','Tríceps','Total','Estenda os cotovelos sem movimentar o ombro.'],['Cadeira flexora','Pernas','Total','Flexione os joelhos com controle, sem tirar o quadril do assento.']],C:[['Rosca Scott na máquina','Bíceps','Total','Mantenha o braço apoiado e controle a descida.'],['Rosca martelo com halteres','Bíceps','Por mão','Palmas voltadas para dentro; cotovelos estáveis.'],['Tríceps máquina com apoio','Tríceps','Total','Braços apoiados; estenda os cotovelos sem trancos.'],['Extensão de tríceps na polia','Tríceps','Total','Cotovelos próximos ao corpo, sem usar impulso.'],['Supino reto na máquina','Peito','Anilhas por lado','Empurre à frente sem perder o apoio das costas.'],['Peck deck','Peito','Total','Feche os braços sem forçar a articulação do ombro.'],['Puxada alta na máquina','Costas','Total','Puxe para a parte superior do peito.'],['Remada baixa na máquina','Costas','Total','Puxe os cotovelos para trás, com tronco estável.'],['Cadeira adutora','Pernas','Total','Feche as pernas lentamente e retorne com controle.'],['Cadeira abdutora','Pernas','Total','Abra as pernas de forma controlada, sem impulso.']]};
const confirmed={'Rosca martelo com halteres':6,'Extensão de tríceps na polia':20,'Supino reto na máquina':10,'Puxada alta na máquina':25,'Remada baixa na máquina':25,'Cadeira adutora':20};const key='muscletrack-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{}}catch(e){data={}}data.history ||= [];data.drafts ||= {};data.custom ||= {};let tab='A',timer=null,seconds=0;const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){toast('Não foi possível salvar neste navegador')}}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}function exlist(t){return [...exercises[t],...(data.custom[t]||[])]}function draft(t,i){const e=exlist(t)[i],k=t+'-'+i;if(!data.drafts[k]){let prev=[...data.history].reverse().find(h=>h.items.some(x=>x.name===e[0]));let old=prev?.items.find(x=>x.name===e[0]);let w=old?.sets?.[0]?.weight??confirmed[e[0]]??'';data.drafts[k]={sets:Array.from({length:3},()=>({weight:w,reps:15,done:false}))}}return data.drafts[k]}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('saveBtn').style.display=['A','B','C'].includes(tab)?'block':'none';if(['A','B','C'].includes(tab))renderWorkout();else if(tab==='history')renderHistory();else renderSettings()}
function renderWorkout(){const arr=exlist(tab),done=arr.reduce((n,e,i)=>n+draft(tab,i).sets.filter(s=>s.done).length,0);$('main').innerHTML=`<div class="card"><div class="row"><div><h2>Treino ${tab} · ${ {A:'Segunda',B:'Quarta',C:'Sábado'}[tab]}</h2><p style="margin:6px 0">3 × 15 por exercício · ajuste à sua recuperação</p></div><div class="pill">${done}/${arr.length*3} séries</div></div><div class="hint">Pesos em kg. Confira “por lado”, “por mão” ou “total” em cada exercício. Os valores iniciais conhecidos são referências do treino anterior, não metas obrigatórias.</div></div>`+arr.map((e,i)=>{const d=draft(tab,i);return `<section class="card"><div class="row"><div><div class="exname">${i+1}. ${safe(e[0])}</div><div class="tag">${safe(e[1])} · ${safe(e[2])}</div></div><span class="pill">${d.sets.filter(s=>s.done).length}/3</span></div><details><summary>Como executar / vídeo</summary><p class="small">${safe(e[3])}</p><a class="link small" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e[0]+' execução correta academia')}">Buscar demonstrações no YouTube ↗</a></details><div class="set muted"><span>Série</span><span>Peso (kg)</span><span>Reps</span><span>Feita</span></div>${d.sets.map((s,j)=>`<div class="set"><span>${j+1}</span><input aria-label="Peso da série ${j+1}" type="number" min="0" step="0.5" value="${safe(s.weight)}" data-i="${i}" data-j="${j}" data-k="weight"><input aria-label="Repetições da série ${j+1}" type="number" min="0" max="100" value="${safe(s.reps)}" data-i="${i}" data-j="${j}" data-k="reps"><button data-done="${i}-${j}" class="${s.done?'done':''}">${s.done?'✓':'○'}</button></div>`).join('')}</section>`}).join('')+`<div class="card"><h2>Exercício extra</h2><p class="small">Encontrou outra máquina? Adicione ao treino atual.</p><div class="grid"><div class="field" style="grid-column:span 2"><label>Nome</label><input id="customName" placeholder="Ex.: elevação lateral"></div><div class="field"><label>Grupo</label><input id="customGroup" placeholder="Ombros"></div></div><button class="btn" id="addCustom">+ Adicionar</button></div>`;document.querySelectorAll('[data-k]').forEach(inp=>inp.addEventListener('input',()=>{let s=draft(tab,+inp.dataset.i).sets[+inp.dataset.j];s[inp.dataset.k]=inp.value;persist()}));document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.done.split('-').map(Number);let s=draft(tab,i).sets[j];s.done=!s.done;persist();render()});$('addCustom').onclick=()=>{let n=$('customName').value.trim(),g=$('customGroup').value.trim()||'Outros';if(!n)return toast('Informe o nome');data.custom[tab]||=[];data.custom[tab].push([n,g,'Total','Peça orientação ao instrutor para ajustar a execução.']);persist();render()}}
function save(){let items=exlist(tab).map((e,i)=>({name:e[0],group:e[1],unit:e[2],sets:draft(tab,i).sets.filter(s=>s.done).map(s=>({weight:s.weight,reps:s.reps}))})).filter(e=>e.sets.length);if(!items.length)return toast('Marque pelo menos uma série concluída');let h={id:Date.now(),date:new Date().toISOString(),day:tab,items};data.history.push(h);Object.keys(data.drafts).filter(k=>k.startsWith(tab+'-')).forEach(k=>data.drafts[k].sets.forEach(s=>s.done=false));persist();toast('Treino salvo no histórico!');tab='history';render()}
function renderHistory(){let hs=[...data.history].reverse();$('main').innerHTML=`<div class="card"><h2>Histórico de treinos</h2><p>Seus registros ficam armazenados neste navegador. Exporte um backup regularmente.</p></div>`+(hs.length?hs.map(h=>`<div class="card"><div class="row"><b>${new Date(h.date).toLocaleDateString('pt-BR')} · Treino ${safe(h.day)}</b><span class="pill">${h.items.reduce((n,x)=>n+x.sets.length,0)} séries</span></div>${h.items.map(x=>`<div class="log"><b>${safe(x.name)}</b><div class="muted">${x.sets.map(s=>safe(s.weight)+' kg × '+safe(s.reps)).join(' · ')} (${safe(x.unit)})</div></div>`).join('')}<div class="actions"><button class="btn" data-del="${h.id}">Excluir registro</button></div></div>`).join(''):'<div class="card">Ainda não há treinos salvos. Marque séries e toque em “Salvar treino”.</div>');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Excluir este treino do histórico?')){data.history=data.history.filter(h=>h.id!==+b.dataset.del);persist();render()}})}
function renderSettings(){$('main').innerHTML=`<div class="card"><h2>Seus dados</h2><p>O app funciona sem conta e sem internet após abrir o arquivo. Os dados são guardados neste navegador e podem ser apagados ao limpar os dados do site. Em outras abas do mesmo navegador e endereço, os dados são atualizados automaticamente. Para outros navegadores ou celulares, exporte e importe o backup; sincronização automática entre eles exige um servidor ou serviço online.</p><div class="actions"><button class="btn primary" id="export">⬇ Exportar backup JSON</button><button class="btn" id="csv">⬇ Histórico CSV</button></div><div class="actions"><label class="btn" style="flex:1;text-align:center">⬆ Importar backup<input id="import" type="file" accept="application/json" hidden></label></div><p class="small">Os vídeos abrem uma pesquisa no YouTube e exigem internet.</p></div><div class="card"><h2>Progressão</h2><p>Quando completar as séries com boa técnica e 2–3 repetições de reserva, aumente a carga um incremento pequeno. Se chegar perto da falha, mantenha ou reduza.</p><p>Treinos: segunda, quarta e sábado. Sexta: caminhada. Confirme a execução com o instrutor.</p></div>`;$('export').onclick=()=>download('muscletrack-backup.json',JSON.stringify(data,null,2),'application/json');$('csv').onclick=()=>{let rows=[['Data','Treino','Exercício','Unidade','Série','Peso kg','Repetições']];data.history.forEach(h=>h.items.forEach(x=>x.sets.forEach((s,i)=>rows.push([new Date(h.date).toLocaleDateString('pt-BR'),h.day,x.name,x.unit,i+1,s.weight,s.reps]))));download('muscletrack-historico.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n'),'text/csv')};$('import').onchange=async ev=>{try{let d=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(d.history)||typeof d.drafts!=='object')throw Error();if(confirm('Substituir os dados atuais pelo backup?')){data=d;data.custom||={};persist();render();toast('Backup importado')}}catch(e){toast('Arquivo de backup inválido')}}}
function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('saveBtn').onclick=save;$('timerBtn').onclick=()=>{if(timer){clearInterval(timer);timer=null;seconds=0;$('timerBtn').textContent='⏱ Descanso 60s';return}seconds=60;$('timerBtn').textContent='⏱ '+seconds+'s';timer=setInterval(()=>{seconds--;$('timerBtn').textContent='⏱ '+seconds+'s';if(seconds<=0){clearInterval(timer);timer=null;$('timerBtn').textContent='⏱ Descanso 60s';toast('Descanso concluído!');if(navigator.vibrate)navigator.vibrate([150,100,150])}},1000)};window.addEventListener('storage',ev=>{if(ev.key===key&&ev.newValue){try{data=JSON.parse(ev.newValue);data.history||=[];data.drafts||={};data.custom||={};render();toast('Dados atualizados de outra aba')}catch(e){}}});
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
const connectionStatus=document.getElementById('connectionStatus');function updateConnection(){connectionStatus.textContent=navigator.onLine?'Local · Online':'Local · Offline'}window.addEventListener('online',updateConnection);window.addEventListener('offline',updateConnection);updateConnection();render();
</script></body></html>
